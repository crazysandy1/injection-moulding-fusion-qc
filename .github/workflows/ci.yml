name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: fusion_system/requirements.txt
      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install timm numpy pandas scikit-learn scipy pillow pytest ruff
      - name: Lint
        run: ruff check tests --select E9,F63,F7,F82
      - name: Byte-compile
        run: python -m compileall -q fusion_system
      - name: Tests
        run: pytest -q tests
